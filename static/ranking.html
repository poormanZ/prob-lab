<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>랭킹</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <div class="top-row">
    <h1>랭킹</h1>
    <nav class="nav"><a href="/" id="gameLink">게임으로</a></nav>
  </div>
  <p id="rankRule">상금 받은 단계 순. 같으면 받은 상금 순.</p>
  <div id="account" class="account-slot"></div>
</header>

<main class="lower rank-page">
  <nav class="tabs rank-tabs" aria-label="게임 선택">
    <a href="/ranking" id="tab-streak">강화</a>
    <a href="/ranking?game=duel" id="tab-duel">대결</a>
  </nav>
  <section class="panel rank-panel">
    <div class="rank-head"><h2>TOP 100</h2><span class="note" id="rankTotal"></span></div>
    <p class="my-rank" id="myRank" hidden></p>
    <div class="tbl"><table class="rank-table">
      <thead><tr id="rankHead"><th>순위</th><th>아이디</th><th>최고 단계</th><th>받은 상금</th><th>달성일</th></tr></thead>
      <tbody id="rankRows"><tr><td colspan="5" class="empty">불러오는 중…</td></tr></tbody>
    </table></div>
    <p class="note" id="rankNote">상금 받기로 끝낸 판만 기록. 잭팟 포함.</p>
  </section>
</main>
<script type="module" src="/ranking.js"></script>
</body>
</html>
