name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
      D1_NAME: prob-theory-lab-db
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN secret is required}"
          : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID secret is required}"
      - name: Resolve D1 database
        shell: bash
        run: |
          set -euo pipefail
          find_id() { npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const db=JSON.parse(s).find(x=>x.name===process.argv[1]);process.stdout.write(db?db.uuid:"")})' "${D1_NAME}"; }
          D1_ID="$(find_id)"
          if [ -z "${D1_ID}" ]; then
            npx wrangler d1 create "${D1_NAME}"
            D1_ID="$(find_id)"
          fi
          : "${D1_ID:?Unable to resolve the D1 database id}"
          sed -i "s#REPLACE_WITH_D1_DATABASE_ID#${D1_ID}#" wrangler.toml
          grep -q "${D1_ID}" wrangler.toml
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply "${D1_NAME}" --remote
      - name: Generate secret file
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${KAKAO_REST_API_KEY:-}" ]; then
            node -e 'const e=process.env;const o={KAKAO_REST_API_KEY:e.KAKAO_REST_API_KEY};if(e.KAKAO_CLIENT_SECRET)o.KAKAO_CLIENT_SECRET=e.KAKAO_CLIENT_SECRET;process.stdout.write(JSON.stringify(o))' > worker-secrets.json
            echo "SECRETS_ARG=--secrets-file worker-secrets.json" >> "$GITHUB_ENV"
          else
            echo "::warning::KAKAO_REST_API_KEY secret is not set. The game deploys, but Kakao login stays disabled."
            echo "SECRETS_ARG=" >> "$GITHUB_ENV"
          fi
      - name: Deploy Worker
        shell: bash
        run: |
          set -euo pipefail
          # SECRETS_ARG is intentionally unquoted so an empty value adds no argument.
          npx wrangler deploy ${SECRETS_ARG} 2>&1 | tee deploy.log
          APP_URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' deploy.log | tail -n 1 || true)"
          if [ -z "${APP_URL}" ]; then
            echo "Unable to discover the workers.dev HTTPS URL from Wrangler output."
            exit 1
          fi
          echo "APP_URL=${APP_URL}" >> "$GITHUB_ENV"
          echo "Worker URL: ${APP_URL}"
      - name: Smoke test health endpoint
        shell: bash
        run: |
          set -euo pipefail
          # A first deploy can 404 for a few seconds while the workers.dev route propagates.
          curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors "${APP_URL}/health"
      - name: Cleanup temporary files
        if: always()
        run: rm -f worker-secrets.json deploy.log
